name: Build Komikku Source Import APK

on:
  push:
    branches:
      - komikku-source-import
    paths:
      - "komikku-source-import.zip.part-*"
      - ".github/workflows/build-komikku-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore source archive
        run: |
          cat komikku-source-import.zip.part-* > /tmp/komikku-source-import.zip
          echo "f64a258141a948faa3f3cdc6b1dab2c2d1c219050c272371273191fa8f1f51b5  /tmp/komikku-source-import.zip" | sha256sum --check
          unzip -q /tmp/komikku-source-import.zip -d /tmp/komikku-source-import
          test -f /tmp/komikku-source-import/komikku-master/gradlew

      - name: Initialize source Git metadata
        working-directory: /tmp/komikku-source-import/komikku-master
        run: |
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Prepare source archive for build"

      - name: Format and verify source
        working-directory: /tmp/komikku-source-import/komikku-master
        run: |
          chmod +x ./gradlew
          ./gradlew spotlessApply
          ./gradlew spotlessCheck

      - name: Build debug APK
        working-directory: /tmp/komikku-source-import/komikku-master
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Komikku-Source-Import-debug-apk
          path: /tmp/komikku-source-import/komikku-master/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

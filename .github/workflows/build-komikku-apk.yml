name: Build Komikku Source Import APK

on:
  push:
    branches:
      - komikku-source-import
    paths:
      - "komikku-source-import.zip.part-*"
      - ".github/workflows/build-komikku-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore source archive
        run: |
          cat komikku-source-import.zip.part-* > /tmp/komikku-source-import.zip
          echo "e763dd84553951024957a5ea62e6376f35c151fadc32e15a8cec9ebde6e1c172  /tmp/komikku-source-import.zip" | sha256sum --check
          unzip -q /tmp/komikku-source-import.zip -d /tmp/komikku-source-import
          test -f /tmp/komikku-source-import/komikku-master/gradlew

      - name: Initialize source Git metadata
        working-directory: /tmp/komikku-source-import/komikku-master
        run: |
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Prepare source archive for build"

      - name: Format and verify source
        working-directory: /tmp/komikku-source-import/komikku-master
        run: |
          chmod +x ./gradlew
          ./gradlew spotlessApply --quiet
          ./gradlew spotlessCheck --quiet

      - name: Build debug APK
        working-directory: /tmp/komikku-source-import/komikku-master
        run: |
          ./gradlew assembleDebug --quiet --stacktrace

      - name: Test import recovery
        working-directory: /tmp/komikku-source-import/komikku-master
        run: ./gradlew :app:testDebugUnitTest --tests "eu.kanade.tachiyomi.ui.browse.source.browse.SourceImport*Test" --stacktrace

      - name: Upload import test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Source-Import-test-reports
          path: |
            /tmp/komikku-source-import/komikku-master/app/build/test-results/testDebugUnitTest/
            /tmp/komikku-source-import/komikku-master/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Komikku-Source-Import-debug-apk
          path: /tmp/komikku-source-import/komikku-master/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
